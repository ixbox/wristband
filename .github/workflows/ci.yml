name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json, curl
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit

  lowest:
    name: PHP 7.2 (lowest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'
          extensions: openssl, json, curl
          coverage: none
          tools: composer:v2
      # Checks that the lower bounds in composer.json (e.g. the polyfills) really suffice.
      - run: composer update --no-interaction --no-progress --prefer-dist --prefer-lowest
      - run: vendor/bin/phpunit

  phpstan:
    name: PHPStan (target PHP 7.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
